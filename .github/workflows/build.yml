# ──────────────────────────────────────────────────────────────────────────────
#  PlayTorrioV3 — Multi-Platform CI/CD Release Builder
#  Builds:
#    - Windows: Installer (Inno Setup) & Portable ZIP (x64)
#    - Android: Split-per-ABI APKs (arm64-v8a, armeabi-v7a, x86_64) & Universal APK
#    - Linux: AppImage & Tar.gz (x86_64)
#  Trigger: Git tag push (v*) or Manual Workflow Dispatch
#  Environment: Injects --dart-define-from-file=.env using ${{ secrets.ENV_FILE }}
# ──────────────────────────────────────────────────────────────────────────────
name: Build and Release Dizzy-v3

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ─── Windows Build ────────────────────────────────────────────────────────
  windows:
    name: Windows (Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Pre-seed TorrServer binary (upstream mirror is gone)
        shell: bash
        run: |
          # torrserver_flutter 0.0.6 downloads torrserver-windows-amd64.zip from
          # ayman708-UX/torrserver_flutter, which no longer exists (HTTP 404);
          # cmake_install then fails with "file INSTALL cannot find torrserver.exe".
          # The plugin prefers $TORRSERVER_FLUTTER_LOCAL_BINARIES, so seed the
          # official YouROK/TorrServer build under the filename it expects.
          mkdir -p .torrserver-bin
          curl -fSL "https://github.com/YouROK/TorrServer/releases/download/MatriX.147.2/TorrServer-windows-amd64.exe" \
            -o .torrserver-bin/torrserver-windows-amd64.exe
          # Release assets can be replaced under the same tag — pin the bytes.
          echo "b38b60dae8d080cfb5ff8941c24b9168796521e576ddf2b7db8b9b20406b46c6  .torrserver-bin/torrserver-windows-amd64.exe" | sha256sum -c -

      - name: Build Windows App
        # permission_handler_windows needs this on VS2022 17.11+ (MSVC 14.41+):
        # its <experimental/coroutine> include became a hard error (C2338).
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          TORRSERVER_FLUTTER_LOCAL_BINARIES: ${{ github.workspace }}/.torrserver-bin
        run: flutter build windows --release --dart-define-from-file=.env

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "PATH refreshed for Inno Setup."

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v\d') {
            $cleanVersion = $ref.TrimStart('v')
          } else {
            # workflow_dispatch on a branch: take the app version from pubspec
            # so the installer is never stamped "main".
            $cleanVersion = (Select-String -Path "pubspec.yaml" -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          }
          if ([string]::IsNullOrWhiteSpace($cleanVersion)) { $cleanVersion = "1.1.5" }

          $isccCmd = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $isccCmd) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\iscc.exe"
            )
            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                $isccCmd = $candidate
                break
              }
            }
          }
          if (-not $isccCmd) {
            throw "ISCC compiler executable could not be found!"
          }
          Write-Host "Using Inno Setup Compiler at: $isccCmd"

          New-Item -ItemType Directory -Force -Path "installer\windows\Output"

          & $isccCmd /DMyAppVersion=$cleanVersion installer\windows\setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          if (Test-Path "installer\windows\Output\Dizzy-Windows-Setup.exe") {
            Copy-Item "installer\windows\Output\Dizzy-Windows-Setup.exe" ".\Dizzy-Windows-Setup.exe" -Force
            Write-Host "Verified and copied Dizzy-Windows-Setup.exe to root."
          } else {
            throw "Dizzy-Windows-Setup.exe was not found in Output directory after ISCC compile!"
          }

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Dizzy-Windows-x64-Portable.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-v3-Windows
          path: |
            Dizzy-Windows-Setup.exe
            Dizzy-Windows-x64-Portable.zip

  # ─── Android Build (Split-per-ABI & Universal) ───────────────────────────
  android:
    name: Android (Split APKs & Universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Pre-seed TorrServer Android binaries (upstream mirror is gone)
        run: |
          # torrserver_flutter 0.0.6 fetches per-ABI TorrServer binaries from
          # ayman708-UX/torrserver_flutter (deleted → HTTP 404). Its Gradle task
          # swallows the failure and the APK ships WITHOUT libtorrserver.so,
          # silently killing torrent streaming (v1.3.3 was first built that way).
          # Seed the official YouROK/TorrServer builds under the filenames the
          # Gradle task looks for via TORRSERVER_FLUTTER_LOCAL_BINARIES.
          mkdir -p .torrserver-bin
          base="https://github.com/YouROK/TorrServer/releases/download/MatriX.147.2"
          curl -fSL "$base/TorrServer-android-arm64" -o .torrserver-bin/torrserver-android-arm64
          curl -fSL "$base/TorrServer-android-amd64" -o .torrserver-bin/torrserver-android-amd64
          curl -fSL "$base/TorrServer-android-arm7"  -o .torrserver-bin/torrserver-android-arm7
          curl -fSL "$base/TorrServer-android-386"   -o .torrserver-bin/torrserver-android-386
          chmod +x .torrserver-bin/*
          # Release assets can be replaced under the same tag — pin the bytes.
          sha256sum -c - <<'EOF'
          52e365deb5e80d97b31fe67cc04a269cc7e750b906c42d28cee735d95bbbd02c  .torrserver-bin/torrserver-android-arm64
          1a77717d960067c4c451494f3423aa31101d6deb7874d502ff5758e24cfbeb4b  .torrserver-bin/torrserver-android-amd64
          be10bc7d073487fafc8d076774c4dabf517d13740f8c638aac920093fd7898cc  .torrserver-bin/torrserver-android-arm7
          5a8b7def61731c96556fbbe137175f10322f6f4576676730cc98c45f4b842634  .torrserver-bin/torrserver-android-386
          EOF

      - name: Restore release keystore (stable signing for OTA updates)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/dizzy.keystore
            SIZE=$(stat -c%s android/app/dizzy.keystore)
            echo "Keystore restored from secret (${SIZE} bytes)."
            if [ "$SIZE" -lt 1000 ]; then
              echo "::error::Restored keystore looks corrupted (<1000 bytes)"; exit 1
            fi
          else
            echo "::error::KEYSTORE_BASE64 secret not set — refusing to publish debug-signed APKs (in-place updates from old versions would fail with 'package not valid'). Set the secret and re-run."
            exit 1
          fi

      - name: Patch pdfrx_engine if needed
        run: |
          python3 -c "
          import os, glob
          paths = glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/pdfrx_engine-*/lib/src/native/pdf_file_cache.dart'))
          for p in paths:
              with open(p, 'r') as f: c = f.read()
              if 'bool tryHardLink(' in c and 'catch (e) { return false; }' not in c:
                  c = c.replace('File(targetPath).linkSync(linkPath);', 'try { File(targetPath).linkSync(linkPath); } catch (_) { return false; }')
                  with open(p, 'w') as f: f.write(c)
                  print(f'Patched {p}')
          " || true

      - name: Build Android Split APKs
        env:
          TORRSERVER_FLUTTER_LOCAL_BINARIES: ${{ github.workspace }}/.torrserver-bin
        run: flutter build apk --release --split-per-abi --dart-define-from-file=.env

      - name: Park split outputs (before universal build overwrites them)
        run: |
          # The plain `flutter build apk` step below REGENERATES the whole
          # output dir: per-ABI files get BASE-versionCode copies (pubspec
          # build number, no abiCode*1000 override) while `app-release.apk`
          # stays the true universal. v1.3.0 shipped exactly that mix (arm64
          # asset = versionCode 32 < v1.2.1's 2031) and every v1.2.1 install
          # hard-blocked with INSTALL_FAILED_VERSION_DOWNGRADE
          # ("package not valid"). So the split outputs are parked HERE,
          # before the universal build touches the directory.
          mkdir -p split-out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk split-out/Dizzy-v3-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk split-out/Dizzy-v3-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk split-out/Dizzy-v3-x86_64.apk
          echo "split outputs parked:"; ls -la split-out/

      - name: Build Android Universal APK
        env:
          TORRSERVER_FLUTTER_LOCAL_BINARIES: ${{ github.workspace }}/.torrserver-bin
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Organize and Rename APKs
        run: |
          # Per-ABI assets come from the PARKED split outputs (true split
          # versionCodes, e.g. arm64 = 2*1000+base); Universal is the fresh
          # build above. Never copy per-ABI files from the build dir here —
          # they were overwritten by the universal build (see park step).
          mkdir -p apks
          cp split-out/Dizzy-v3-arm64-v8a.apk apks/Dizzy-v3-arm64-v8a.apk
          cp split-out/Dizzy-v3-armeabi-v7a.apk apks/Dizzy-v3-armeabi-v7a.apk
          cp split-out/Dizzy-v3-x86_64.apk apks/Dizzy-v3-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk apks/Dizzy-v3-Universal.apk
          echo "final APKs:"; ls -la apks/

      - name: Verify TorrServer payload (silent-missing guard)
        run: |
          # The plugin's Gradle downloader catches network errors and keeps
          # going, so a missing libtorrserver.so only shows up as dead torrent
          # streaming at runtime. Fail the release instead.
          fail=0
          for apk in apks/*.apk; do
            case "$apk" in *-legacy-*) continue ;; esac
            if ! unzip -l "$apk" | grep -q "libtorrserver.so"; then
              echo "::error::$apk is missing libtorrserver.so — torrent streaming would be dead."
              fail=1
            else
              echo "$apk contains libtorrserver.so"
            fi
          done
          exit "$fail"

      - name: Build legacy-signed APK mirrors (in-place updates for old installs)
        env:
          LEGACY_KEYSTORE_BASE64: ${{ secrets.LEGACY_KEYSTORE_BASE64 }}
        run: |
          # v1.1.3/v1.1.4 shipped signed with this machine's DEBUG key. Android only
          # accepts an update signed with the SAME key, so every release also ships
          # legacy-signed mirrors — the app's legacy update channel fetches these,
          # letting those installs update IN PLACE (no uninstall ever needed).
          EXPECTED_LEGACY="5e70235900d8a44c350bae08d8949e6491f3724e572d3c9b021a85376ccf1548"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found"; exit 1; fi
          if [ -z "$LEGACY_KEYSTORE_BASE64" ]; then
            echo "::error::LEGACY_KEYSTORE_BASE64 secret not set — v1.1.3/v1.1.4 installs could not update in place. Set it and re-run."
            exit 1
          fi
          echo "$LEGACY_KEYSTORE_BASE64" | base64 --decode > /tmp/dizzy-legacy.keystore
          legacy_fail=0
          for src in apks/Dizzy-v3-*.apk; do
            [ -f "$src" ] || continue
            case "$src" in *-legacy-*) continue ;; esac
            # Legacy names deliberately DROP the arch-vendor token (arm64-v8a,
            # armeabi-v7a, x86_64): pre-1.4.0 apps pick assets by those exact
            # keywords over the UNFILTERED asset list, so keeping them would make
            # old apps' choice depend on GitHub asset ordering. With this naming,
            # old release-key installs always land on the NORMAL APK (majority
            # safe), while legacy-key users follow the release-notes link once.
            case "$(basename "$src")" in
              Dizzy-v3-arm64-v8a.apk)   dst="apks/Dizzy-v3-legacy-arm64.apk" ;;
              Dizzy-v3-armeabi-v7a.apk) dst="apks/Dizzy-v3-legacy-armeabi.apk" ;;
              Dizzy-v3-x86_64.apk)      dst="apks/Dizzy-v3-legacy-x64.apk" ;;
              Dizzy-v3-Universal.apk)   dst="apks/Dizzy-v3-legacy-Universal.apk" ;;
              *) continue ;;
            esac
            cp "$src" "$dst"
            if ! "$APKSIGNER" sign --ks /tmp/dizzy-legacy.keystore --ks-pass pass:android --key-pass pass:android "$dst"; then
              echo "::error::failed to legacy-sign $dst"; legacy_fail=1; continue
            fi
            fpr="$("$APKSIGNER" verify --print-certs "$dst" 2>/dev/null | grep -oE 'SHA-256 digest: [0-9a-f]+' | head -1 | awk '{print $3}')"
            echo "$dst -> ${fpr:-<none>}"
            if [ "$fpr" != "$EXPECTED_LEGACY" ]; then
              echo "::error::$dst is not signed with the legacy key (${EXPECTED_LEGACY:0:12}...)"
              legacy_fail=1
            fi
          done
          rm -f /tmp/dizzy-legacy.keystore
          exit "$legacy_fail"

      - name: Verify release signing (block wrong-key APKs)
        run: |
          # v1.1.3–v1.1.5 shipped DEBUG-signed and can never update in place.
          # Every APK must match its channel's expected key or the release is blocked:
          #   Dizzy-v3-*.apk        -> release key (CN=Sirius)
          #   Dizzy-v3-legacy-*.apk -> local debug key (v1.1.3/v1.1.4 installs)
          # PLUS: every SPLIT APK's versionCode must be ABOVE 2031 — v1.2.1
          # shipped split APKs with Flutter's abiCode*1000 override (arm64 =
          # 2031) and v1.3.0 shipped base-code copies (arm64 = 32); Android
          # treats new-code < old-code as INSTALL_FAILED_VERSION_DOWNGRADE
          # ("package not valid") even when the key matches.
          # The fat Universal APK is EXEMPT from the floor: it carries the
          # base pubspec build number BY DESIGN (no abiCode*1000 override ever
          # applies to it — e.g. build 1032 -> versionCode 1032), and the app's
          # picker only serves it as the LAST fallback, so no old install ever
          # receives it ahead of its split build.
          # Version floor: pubspec build number must stay >= 1032 (arm64 floor 3032).
          MIN_VERSION_CODE=2031
          EXPECTED="c513faef1906c5d67f01f7ff27946d52fe727773e72324e294c58de5711a1974"
          EXPECTED_LEGACY="5e70235900d8a44c350bae08d8949e6491f3724e572d3c9b021a85376ccf1548"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found"; exit 1; fi
          for must in arm64-v8a armeabi-v7a x86_64 Universal; do
            if [ ! -f "apks/Dizzy-v3-$must.apk" ]; then
              echo "::error::missing apks/Dizzy-v3-$must.apk (organize step uses cp || true) — release blocked."
              exit 1
            fi
          done
          fail=0
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt -type f | sort -V | tail -1)"
          for apk in apks/*.apk; do
            if [[ "$apk" == *-legacy-* ]]; then want="$EXPECTED_LEGACY"; else want="$EXPECTED"; fi
            out="$("$APKSIGNER" verify --print-certs "$apk" 2>&1 || true)"
            fpr="$(echo "$out" | grep -oE 'SHA-256 digest: [0-9a-f]+' | head -1 | awk '{print $3}')"
            echo "$apk -> ${fpr:-<no-cert-or-invalid-apk>} (want ${want:0:12}...)"
            if [ "$fpr" != "$want" ]; then
              echo "::error::$apk is NOT signed with the expected key (${want:0:12}...). Old installs could not update over it — release blocked."
              fail=1
            fi
            # versionCode floor: v1.2.1 split APKs shipped 1031/2031/4031.
            # Any SPLIT APK at/below 2031 re-triggers the v1.3.0 downgrade
            # block. The fat Universal is exempt (base build number by
            # design — no abiCode*1000 override; picker serves it last).
            if [ -n "$AAPT" ] && [[ "$apk" != *-legacy-* ]] && [[ "$apk" != *-Universal.apk ]]; then
              vc="$("$AAPT" dump badging "$apk" 2>/dev/null | grep -oE "versionCode='[0-9]+'" | grep -oE '[0-9]+' | head -1)"
              echo "$apk versionCode=${vc:-<unknown>} (must be > $MIN_VERSION_CODE)"
              if [ -z "$vc" ] || [ "$vc" -le "$MIN_VERSION_CODE" ]; then
                echo "::error::$apk versionCode ${vc:-unknown} is not above $MIN_VERSION_CODE — v1.2.1 installs would see INSTALL_FAILED_VERSION_DOWNGRADE. Bump pubspec build number. Release blocked."
                fail=1
              fi
            fi
          done
          exit "$fail"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-v3-Android-APKs
          path: apks/*.apk

  # ─── Linux x64 Build (AppImage & Tar.gz) ──────────────────────────────────
  linux-x64:
    name: Linux x64 (AppImage & Tar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev xvfb \
            libboost-all-dev libssl-dev libgcrypt20-dev

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Generate Linux platform files if missing
        run: |
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Pre-seed TorrServer binary (upstream mirror is gone)
        run: |
          # torrserver_flutter 0.0.6 downloads torrserver-linux-amd64.tar.gz from
          # ayman708-UX/torrserver_flutter, which no longer exists (HTTP 404);
          # cmake_install then fails with "file INSTALL cannot find torrserver".
          # The plugin prefers $TORRSERVER_FLUTTER_LOCAL_BINARIES, so seed the
          # official YouROK/TorrServer build under the filename it expects.
          mkdir -p .torrserver-bin
          curl -fSL "https://github.com/YouROK/TorrServer/releases/download/MatriX.147.2/TorrServer-linux-amd64" \
            -o .torrserver-bin/torrserver-linux-amd64
          chmod +x .torrserver-bin/torrserver-linux-amd64
          # Release assets can be replaced under the same tag — pin the bytes.
          echo "0c8810e25addf183e9337c1dd1d274c79f72a2947a0b5967d2412a888ce7ea0c  .torrserver-bin/torrserver-linux-amd64" | sha256sum -c -

      - name: Build Linux Release
        env:
          TORRSERVER_FLUTTER_LOCAL_BINARIES: ${{ github.workspace }}/.torrserver-bin
        run: flutter build linux --release --dart-define-from-file=.env

      - name: Package as AppImage & Tar
        run: |
          curl -fSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o appimagetool
          chmod +x appimagetool

          APP=Dizzy.AppDir
          mkdir -p "$APP"
          cp -r build/linux/x64/release/bundle/* "$APP/"

          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png "$APP/Dizzy.png"
          elif [ -f "icon.png" ]; then
            cp icon.png "$APP/Dizzy.png"
          else
            touch "$APP/Dizzy.png"
          fi

          cat <<EOF > "$APP/Dizzy.desktop"
          [Desktop Entry]
          Name=Dizzy
          Exec=AppRun
          Icon=Dizzy
          Type=Application
          Categories=AudioVideo;Audio;Video;Player;
          EOF

          printf '#!/bin/sh\ncd "$(dirname "$0")"\nexec ./dizzy "$@"\n' > "$APP/AppRun"
          chmod +x "$APP/AppRun"

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APP" Dizzy-Linux-x86_64.AppImage
          tar -czvf Dizzy-Linux-x86_64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-v3-Linux-x64
          path: |
            Dizzy-Linux-x86_64.AppImage
            Dizzy-Linux-x86_64.tar.gz

  # ─── Create / Publish GitHub Release ─────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [windows, android, linux-x64]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Dizzy-v3 ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            *.exe
            *.zip
            *.apk
            *.AppImage
            *.tar.gz
