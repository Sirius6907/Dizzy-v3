# ──────────────────────────────────────────────────────────────────────────────
#  PlayTorrioV3 — Multi-Platform CI/CD Release Builder
#  Builds:
#    - Windows: Installer (Inno Setup) & Portable ZIP (x64)
#    - Android: Split-per-ABI APKs (arm64-v8a, armeabi-v7a, x86_64) & Universal APK
#    - Linux: AppImage & Tar.gz (x86_64)
#    - macOS: Apple Silicon (ARM64) & Intel (x64) DMG & ZIP
#    - iOS: Sideloadable IPA (no-codesign)
#  Trigger: Git tag push (v*) or Manual Workflow Dispatch
#  Environment: Injects --dart-define-from-file=.env using ${{ secrets.ENV_FILE }}
# ──────────────────────────────────────────────────────────────────────────────
name: Build and Release Dizzy-v3

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ─── Windows Build ────────────────────────────────────────────────────────
  windows:
    name: Windows (Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release --dart-define-from-file=.env

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "PATH refreshed for Inno Setup."

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cleanVersion = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($cleanVersion)) { $cleanVersion = "1.1.5" }

          $isccCmd = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $isccCmd) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\iscc.exe"
            )
            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                $isccCmd = $candidate
                break
              }
            }
          }
          if (-not $isccCmd) {
            throw "ISCC compiler executable could not be found!"
          }
          Write-Host "Using Inno Setup Compiler at: $isccCmd"

          New-Item -ItemType Directory -Force -Path "installer\windows\Output"

          & $isccCmd /DMyAppVersion=$cleanVersion installer\windows\setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          if (Test-Path "installer\windows\Output\Dizzy-Windows-Setup.exe") {
            Copy-Item "installer\windows\Output\Dizzy-Windows-Setup.exe" ".\Dizzy-Windows-Setup.exe" -Force
            Write-Host "Verified and copied Dizzy-Windows-Setup.exe to root."
          } else {
            throw "Dizzy-Windows-Setup.exe was not found in Output directory after ISCC compile!"
          }

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Dizzy-Windows-x64-Portable.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-v3-Windows
          path: |
            Dizzy-Windows-Setup.exe
            Dizzy-Windows-x64-Portable.zip

  # ─── Android Build (Split-per-ABI & Universal) ───────────────────────────
  android:
    name: Android (Split APKs & Universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Patch pdfrx_engine if needed
        run: |
          python3 -c "
          import os, glob
          paths = glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/pdfrx_engine-*/lib/src/native/pdf_file_cache.dart'))
          for p in paths:
              with open(p, 'r') as f: c = f.read()
              if 'bool tryHardLink(' in c and 'catch (e) { return false; }' not in c:
                  c = c.replace('File(targetPath).linkSync(linkPath);', 'try { File(targetPath).linkSync(linkPath); } catch (_) { return false; }')
                  with open(p, 'w') as f: f.write(c)
                  print(f'Patched {p}')
          " || true

      - name: Build Android Split APKs
        run: flutter build apk --release --split-per-abi --dart-define-from-file=.env

      - name: Build Android Universal APK
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Organize and Rename APKs
        run: |
          mkdir -p apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apks/Dizzy-v3-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apks/Dizzy-v3-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk apks/Dizzy-v3-x86_64.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk apks/Dizzy-v3-Universal.apk || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-v3-Android-APKs
          path: apks/*.apk

  # ─── Linux x64 Build (AppImage & Tar.gz) ──────────────────────────────────
  linux-x64:
    name: Linux x64 (AppImage & Tar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev xvfb \
            libboost-all-dev libssl-dev libgcrypt20-dev

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Generate Linux platform files if missing
        run: |
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release --dart-define-from-file=.env

      - name: Package as AppImage & Tar
        run: |
          curl -fSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o appimagetool
          chmod +x appimagetool

          APP=Dizzy.AppDir
          mkdir -p "$APP"
          cp -r build/linux/x64/release/bundle/* "$APP/"

          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png "$APP/Dizzy.png"
          elif [ -f "icon.png" ]; then
            cp icon.png "$APP/Dizzy.png"
          else
            touch "$APP/Dizzy.png"
          fi

          cat <<EOF > "$APP/Dizzy.desktop"
          [Desktop Entry]
          Name=Dizzy
          Exec=AppRun
          Icon=Dizzy
          Type=Application
          Categories=AudioVideo;Audio;Video;Player;
          EOF

          printf '#!/bin/sh\ncd "$(dirname "$0")"\nexec ./dizzy "$@"\n' > "$APP/AppRun"
          chmod +x "$APP/AppRun"

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APP" Dizzy-Linux-x86_64.AppImage
          tar -czvf Dizzy-Linux-x86_64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-v3-Linux-x64
          path: |
            Dizzy-Linux-x86_64.AppImage
            Dizzy-Linux-x86_64.tar.gz

  # ─── macOS ARM64 Build (Apple Silicon) ───────────────────────────────────
  macos-arm64:
    name: macOS (Apple Silicon ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Configure macOS platform files if missing
        run: |
          if [ ! -d "macos" ]; then
            flutter create --platforms=macos .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release --dart-define-from-file=.env

      - name: Package as DMG & ZIP
        run: |
          cd build/macos/Build/Products/Release
          mv dizzy.app Dizzy.app

          codesign --sign - --force --deep Dizzy.app

          mkdir -p dmg_temp
          cp -R Dizzy.app dmg_temp/
          ln -s /Applications dmg_temp/Applications

          sync
          sleep 2

          for i in {1..3}; do
            hdiutil create -volname "Dizzy" -srcfolder dmg_temp -ov -format UDZO ../../../../../Dizzy-macOS-arm64.dmg && break || sleep 3
          done
          zip -ry ../../../../../Dizzy-macOS-arm64.zip Dizzy.app

      - name: Upload macOS ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-v3-macOS-arm64
          path: |
            Dizzy-macOS-arm64.dmg
            Dizzy-macOS-arm64.zip

  # ─── macOS Intel Build (x86_64) ──────────────────────────────────────────
  macos-intel:
    name: macOS (Intel x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Setup Flutter x64
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          architecture: x64
          cache: true

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: arch -x86_64 flutter pub get

      - name: Build macOS Intel Release
        run: arch -x86_64 flutter build macos --release --dart-define-from-file=.env

      - name: Package as DMG & ZIP
        run: |
          cd build/macos/Build/Products/Release
          mv dizzy.app Dizzy.app

          codesign --sign - --force --deep Dizzy.app

          mkdir -p dmg_temp
          cp -R Dizzy.app dmg_temp/
          ln -s /Applications dmg_temp/Applications

          sync
          sleep 2

          for i in {1..3}; do
            hdiutil create -volname "Dizzy" -srcfolder dmg_temp -ov -format UDZO ../../../../../Dizzy-macOS-intel.dmg && break || sleep 3
          done
          zip -ry ../../../../../Dizzy-macOS-intel.zip Dizzy.app

      - name: Upload macOS Intel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-v3-macOS-intel
          path: |
            Dizzy-macOS-intel.dmg
            Dizzy-macOS-intel.zip

  # ─── iOS Build (Sideloadable IPA — no-codesign) ───────────────────────────
  ios:
    name: iOS (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env

      - name: Package as IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -ry ../../../Dizzy-iOS.ipa Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-v3-iOS
          path: Dizzy-iOS.ipa

  # ─── Create / Publish GitHub Release ─────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [windows, android, linux-x64, macos-arm64, macos-intel, ios]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Dizzy-v3 ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            *.exe
            *.zip
            *.apk
            *.AppImage
            *.tar.gz
            *.dmg
            *.ipa
