name: CI

# Quality gate — runs on every push to main and every PR.
# Release builds stay in build.yml (tag-only); this file only gates code health.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Runtime .env for tests that opt in (EnvService.initialize() reads it
      # from disk — e.g. the live_probe_audit corpus). Do NOT pass
      # --dart-define-from-file: that would bake SUPABASE_URL into the test
      # binaries at compile time, and the suite's premise is APK parity
      # ("test env ships no key", "cloud unconfigured in test env").
      - name: Setup .env from GitHub Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.DOTENV }}" ]; then
            echo "${{ secrets.DOTENV }}" > .env
          else
            touch .env
          fi
          # The live_probe_audit corpus needs a TMDB key at runtime (never a
          # dart-define: test binaries must compile keyless / APK parity).
          if [ -n "${{ secrets.TMDB_API_KEY }}" ]; then
            echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> .env
          fi

      - name: Static analysis (zero issues)
        run: flutter analyze

      - name: Test suite
        run: flutter test

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
